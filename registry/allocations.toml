# ======================================================================
# elekloader (vendor/elekloader, GPL-2.0-or-later, pinned in the Makefile): mods
# 0027-elekloader (its core-ar2 0.1, the boot copier and hook bus) and 0028-elek-hello
# (the first mod whose code lives in elekloader's DDR area). mods/0027-elekloader/design.md.
#
# The area 0x47BE0000-0x47C00000 (128 KB) is elekloader's Rytm `ddr`: elekloader's linker
# places every format-2 mod's .run/.bss there and core-ar2's .boot copies it out at the
# OS entry's third call (0x400008c0) before the .bss clear and the cache enable. It is
# not a cave of the image (nothing of it is in MAIN OS), so it is not a [[pool]]: the
# appended block (core's .boot + the run image) lives past the stock image end, inside
# the OS's .bss, and is only read once, at boot. Verified untouched on a unit by
# elekloader's/rytm-mods-src's DDR canary (2026-10-11) [doc]; in rytm-emu by a write/read
# watch and a canary over the free part through play, kit save/reload, sound manager,
# DIN MIDI, Overbridge, power off and a cold reboot [measured 2026-10-16, design.md].
#
# core-ar2's eight sites, as `foreign` patches: their bytes are written by elekloader's
# linker (jsr/jmp to core routines whose addresses only it knows), never by build.py.
# They are claimed here so the overlap checks keep every rytm-mods detour and patch off
# them, and so verify.py accepts exactly these bytes. expect = the stock bytes (as in
# elekloader's mods/core-ar2/mod.json, which pins them again by sha256).
# ======================================================================
