Evidence, all static, 2026-09-26:
- the preceding instruction is `rts`;
- no 4-byte value at any even offset points into it, and no odd-offset match exists
  either; no disassembly operand outside it names an address in it;
- no reference from sections 1, 2, 5 or 8. The one match in the raw MAIN OS section
  is little-endian at an odd offset in rodata (0x401c5545);
- computed jumps: no unresolved table within 64 KB. The dispatches near it are
  `movew %pc@(tbl,%d0:l),%d0; extl %d0; jmp`, whose offsets are SIGNED and so reach
  32 KB downward as well - cavescan's resolver assumes unsigned and stops at the first
  negative entry. So every table within 32 KB on either side (seven, all above it)
  was over-read to 256 raw entries: no word in any of them lands here. The same test
  on cave4, cave5 and cave6 is clean too;
- desync: of 1,823 even referenced addresses within 32 KB, the ones off an
  instruction boundary are jump-table entries (0x4013d07c.., 0x4013dd5c..,
  0x4013e7e6.., 0x4013f5aa..) and one straddling match in a startup table
  (0x401313c0 from 0x40000632), none of them a reference into this pool.

0x401b70d8 +412 stands or falls with it - every reference to it comes from in here -
but only this pool is claimed, and nothing outside it reaches this one, so probing
this pool alone answers for it.

Hardware, 2026-09-26: the control ctrl7 - probe7 with the counter seeded to 3,
differing from it at exactly one byte, 0x402ccfab - read 3, a control seeded
against this pool's own image. probe7 then read 0 after normal use, including the
CONTROL IN menu's copy and paste, which copies the pattern and did not enter the
routine.

"Probably" for the same reasons as cave4, cave5 and cave6: no provoked error paths,
no factory or test modes, no OS upgrade, and no sampling, +Drive or Overbridge
recorded for the session. What carries it is the static case above.
"""

