# FM4's second page on the SMPL page. sound_param_record(index, machine) at
# 0x40007028 is replaced whole by fm4_param_record (same results, except SMPL's
# indices 17..24 on machine 35 give records 449..456); the stub computes the
# stock SMPL records 39..46 rather than reading 0x413db554, because the boot scan
# (0x40006d34) files the rewritten records there too. The stock prologue is
# "move.l %d2,-(%sp); moveq #41,%d1; movea.l 8(%sp),%a0" - the stub reimplements
# the function and returns, so nothing is replayed.
[[detour]]
owner  = "0020-dmach"
addr   = 0x40007028
size   = 6
expect_len = 6
expect_sha256 = "f47a3a411a8269fecbd015d079b69036a084b4245fdf2a5bc2a0d4e1a8d2f09f"
entry  = "fm4_param_record"
rejoin = "none"             # computes the record and returns; stock's lookup never runs
reemit = false

# Records 449..456 are CY TEST's (machine 51), rewritten as SMPL-page records
# (machine 54, indices 17..24) with FM4's names and ranges. CY TEST loses its
# parameters, so build with 0014's test=0 (the TEST machines unlisted). Their CC
# and NRPN fields (+0x18, +0x1c) are -1, so the boot scan does not map MIDI to
# them: CCs keep reaching the stock SMPL records, which store into the same slots.
# +0x10 keeps SMPL's default, +0x20/+0x24 SMPL's values [meaning not established].
[[patch]]
