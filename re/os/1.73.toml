# The Analog Rytm MKII OS the sources are written for: every address in mods/, registry/ and re/symbols.toml is this
# OS's. tools/ostarget.py info() gives the build tools these facts; a port to another OS (re/os/<os>.toml) translates
# the addresses at build time (tools/ostarget.py port).

[meta]
os               = "1.73"
stock            = "Analog-Rytm_MKII_OS1.73.syx"      # Elektron's file, as downloaded; never committed
syx_sha256       = "8ad671087ec30433d5407c7380d2396e0915ab931c5d3dd18a78bf284d3d1e52"
mainos_size      = 3005432
mainos_sha256    = "28d9ef40c895e03f17dfce096543109adaf708947392db72818fc2a412d685d6"
bootstrap_size   = 42302
bootstrap_sha256 = "1b8d3b7288df118512740ac7c59d8dd9f71f44e6633a29628bcb068d756e2ed8"
# elekloader's core-ar2 0.1, built from upstream's source at this commit (the last core for 1.73 without mod storage),
# and the sha256 of the core-0.1.elemod it gives (published beside the bundle)
core_rev         = "8972d70629f230af99c63c8624a886b33ec08299"
core_version     = "0.1"
core_sha256      = "33de51c098ab0ecd9cc57e9dfc3efa3d95f8133b1f4a4e6abd80d5fdba2dd825"
# what tools/release_check.py builds to prove the bundle refuses newer cores (upstream commit, core version)
refuse_cores     = [["92a99c958f9e17bfb93882385037b84185fc0420", "0.2"]]
# the release's file names: the bundle, and the suffix of the core (as elekloader names it: "" for a core's own OS)
bundle_suffix    = ""
core_suffix      = ""

# Data the 0.5.0 reports and the host command read (0026; plan-050 Task 46): RAM, outside the map (a port leaves it as
# it is), so each entry names the stock code that uses it in this OS's image: `site` the instruction, `at` bytes into it
# the operand, `size` 4 an absolute address / 2 a displacement, `value` what must be there. tools/ostarget.py data OS
# checks them [measured in rytm-emu on both OSes: notes in mods/0026-remote-ui/design.md "0.5.0"].
[[data]]
name  = "qperf_pos"
value = 0x42f9210c
size  = 4
site  = 0x40082184
at    = 2
note  = "the QUICK PERF pot's position, u32 0..255 (never cleared; 0 until the panel MCU first sends): the panel parser's kind-4 store"
[[data]]
name  = "qperf_stamp"
value = 0x42f92110
size  = 4
site  = 0x4008217e
at    = 2
note  = "the pot message's time stamp (cleared when the panel tick posts it): the same case's store"
[[data]]
name  = "panel_key_state"
value = 0x418d1340
size  = 4
site  = 0x40081d4e
at    = 2
note  = "the panel keys, one byte a group (FUNC: byte 6 bit 5): the button driver's lea"
[[data]]
name  = "perf_amounts"
value = 0x8000e57c
size  = 4
site  = 0x4011f69c
at    = 2
note  = "SRAM, the 12 PERF macros' live amounts (i16, value << 8): the amount store a PERF CC and the pot reach"
[[data]]
name  = "kit_scene"
value = 0x97e
size  = 2
site  = 0x400a7d68
at    = 2
note  = "kit + 0x97e: the active scene (0..11, 0xff off): scene_set's move.b (the SCNE pads and CC 92)"
[[data]]
name  = "kit_qperf_mask"
value = 0x9bb
size  = 2
site  = 0x400a6dc6
at    = 2
note  = "kit + 0x9bb (long, clamped to 12 bits): the macros on the pot: the type-5 handler's accessor"
[[data]]
name  = "kit_mutes"
value = 0x20
size  = 2
site  = 0x400b7902
at    = 2
note  = "the mute object's + 0x20: the 12 tracks' mutes (bit t): mute_set's store (the MUTE pads and CC 94)"
[[data]]
name  = "pmo_eff"
