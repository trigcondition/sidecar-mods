# Analog Rytm MKII OS 1.74 (Elektron, 2026-10-01), as a port of the 1.73 sources: tools/ostarget.py port 1.74 writes
# the tree for it (build/os/1.74), `make release OS=1.74` builds it. What changed from 1.73 and how the map was made:
# notes in tools/ostarget.py; the study it comes from found the MAIN OS 1.73's with the Outbox's main-output routing
# added (the SELECT TRACKS view's 16 rows, BreakOutBoxOutputRoutingMenuView) and the code after it shifted.
#
# Everything below the GENERATED line comes from both stock images (tools/ostarget.py derive 1.74 <1.73.syx> <1.74.syx>):
# addresses and shifts, and sha256 hashes of 1.74's stock bytes where the mods' claims sit. No firmware bytes.

[meta]
os               = "1.74"
from             = "1.73"                             # the sources' OS (re/os/1.73.toml)
stock            = "Analog-Rytm_MKII_OS1.74.syx"      # in Elektron's Analog-Rytm_MKII_OS1.74_dist.zip; never committed
syx_sha256       = "cb0f99d620edde994fb860c0e79cc2464e427d06882828cfdfb00fc53700e123"
mainos_size      = 3005432
mainos_sha256    = "34cd0c4da8e4b810d1b25284475a99ea53821e2ab7d30a978bf15dc578251f3b"
bootstrap_size   = 42302                              # sections 1, 2 and 8 are 1.73's, byte for byte
bootstrap_sha256 = "1b8d3b7288df118512740ac7c59d8dd9f71f44e6633a29628bcb068d756e2ed8"
# core-ar2 0.1's port to 1.74 (upstream's own, `ports` in its mod.json: the same 8 hooks at 1.74's addresses); the
# 1.73 core stays built from 8972d70, so its published file does not change
core_rev         = "13fa795d601c52a7152c17554ae3b3f6f6ca8b05"
core_version     = "0.1"
core_sha256      = "89c00065e8f83ce839978c45a32200e09879682b8b95cbff0bdb71ca09dc3c8a"
# core 0.2 (its 1.74 port) and the newest 1.74 core at the pinned elekloader (0.6, the web page's): both keep mod
# storage in the bytes 0013 / 0021 / 0025 use, and both must be refused by the guard
refuse_cores     = [["92a99c958f9e17bfb93882385037b84185fc0420", "0.2"], ["c150ac583a4b7e6d64680d5592f4a40f409193f7", "0.6"]]
bundle_suffix    = "-os1.74"
core_suffix      = "-os1.74"

# The load base itself: the image starts there on both (the map's first segment starts after the vectors).
[[exception]]
addr = 0x40000400
to   = 0x40000400

# 1.73's zeros between the code's end and the UTF-16 strings, which 1.74's code grew into by 864 B. The addresses stay
# (claims in pool `cave` are mods' own data there); [pool_override.cave] starts the pool after 1.74's code, and
# layout.py refuses a claim below that.
[padding]
start = 0x402cc91c
end   = 0x402ccff4

[pool_override.cave]
start = 0x402ccc80

# Claims with no room left in 1.74's smaller `cave`: the port leaves them out, so a build that needs one fails ("no
# cave") instead of placing code over 1.74's. 0025's block is for builds with 0025 outside elekloader's area; every
# Sidecar build since 0.4.0's has it in the area (Makefile RELEASE_ARGS --area-elek 0025-sendfx-report).
[[unavailable]]
owner = "0025-sendfx-report"
addr  = 0x402cc920
note  = "1116 B at cave's head: 1.74's code ends at 0x402ccc7c; outside the area 0025 cannot be built for 1.74"

